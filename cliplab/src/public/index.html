<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,noarchive,nosnippet">
<title>ClipLab</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <b>ClipLab</b><span id="modo" class="tag"></span><span id="info" class="muted"></span>
  <form method="post" action="/auth/logout"><button class="ghost">Salir</button></form>
</header>
<main>
  <section class="card">
    <h2>Nuevo video</h2>
    <form id="f">
      <input id="url" type="url" inputmode="url" placeholder="Enlace de YouTube" autocomplete="off" required>
      <div class="plats" id="auto"></div>
      <small class="muted">Marca plataformas para publicar solo el mejor clip de forma automática. Sin marcar, tú eliges por clip.</small>
      <button class="run" id="go" type="submit">Analizar y cortar</button>
    </form>
    <p id="msg"></p>
    <div id="fuentes" class="muted"></div>
  </section>
  <section class="card">
    <h2>Sesiones</h2>
    <p class="muted">Genera el archivo en tu equipo con <code>npm run login -- tiktok</code> y súbelo aquí. Se guarda cifrado.</p>
    <div id="ses"></div>
  </section>
  <section>
    <h2>Clips</h2>
    <div id="clips" class="grid"></div>
  </section>
  <section class="card">
    <h2>Capturas de evidencia</h2>
    <div id="evid" class="muted"></div>
  </section>
</main>
<script src="/app.js" defer></script>
</body>
</html>
