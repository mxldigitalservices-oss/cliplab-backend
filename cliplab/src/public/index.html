<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ClipLab · Panel</title>
  <link rel="stylesheet" href="/css/panel.css">
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <div class="marca"><span class="logo" aria-hidden="true">▶</span><span>ClipLab</span><small>Fase 5</small></div>
      <nav id="nav" aria-label="Secciones"></nav>
      <div class="lateral-pie">
        <div id="conexion" class="conexion" role="status"><span class="punto"></span><span class="txt">Conectando…</span></div>
        <button id="btn-salir" class="btn ghost sm" type="button">Salir</button>
      </div>
    </aside>

    <main class="principal">
      <header class="barra">
        <h1 id="titulo-vista">ClipLab</h1>
        <div class="barra-der">
          <span id="chip-modo" class="chip">…</span>
          <span id="chip-agente" class="chip">…</span>
          <span class="chip regla" title="Regla de oro: todo clip y variante dura como máximo 60 s (ideal 30–60 s)">⏱ Máx. 60 s · ideal 30–60 s</span>
        </div>
      </header>
      <section id="vista" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:1rem">Este panel necesita JavaScript.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
