<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, noarchive">
  <meta name="color-scheme" content="dark">
  <title>ClipLab Pro</title>
  <link rel="stylesheet" href="/css/panel.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">▶</span>
      <div>
        <h1>ClipLab <em>Pro</em></h1>
        <div class="sync"><span id="sync-dot" class="dot"></span><span id="sync-texto">Conectando…</span></div>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-ahora" class="btn ghost small" type="button" title="Actualizar ahora">⟳</button>
      <button id="btn-llave" class="btn ghost small" type="button">🔑 Llave</button>
    </div>
  </header>

  <form id="form-url" class="encolar" autocomplete="off">
    <input id="input-url" type="url" inputmode="url" placeholder="Pega el enlace del video (https://…)" required>
    <button class="btn primary" type="submit">Encolar</button>
  </form>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="resumen">Resumen</button>
    <button class="tab" role="tab" data-tab="clips">Clips <span class="count" data-count="clips">0</span></button>
    <button class="tab" role="tab" data-tab="lotes">Lotes / Variantes <span class="count" data-count="lotes">0</span></button>
    <button class="tab" role="tab" data-tab="incidencias">Incidencias <span class="count alerta" data-count="incidencias">0</span></button>
    <button class="tab" role="tab" data-tab="marketing">Marketing y Analíticas</button>
  </nav>

  <main>
    <section class="vista" data-vista="resumen">
      <div id="r-kpis" class="kpis"></div>
      <h2>Slots activos</h2>
      <div id="r-activos" class="lista"></div>
      <h2>Clips listos recientes</h2>
      <div id="r-listos" class="grid"></div>
      <h2>Actividad reciente</h2>
      <div id="r-recientes" class="lista"></div>
    </section>

    <section class="vista" data-vista="clips" hidden>
      <div class="toolbar">
        <select id="f-estado" aria-label="Filtrar por estado">
          <option value="todos">Todos los estados</option>
          <option value="pendiente">Pendientes</option>
          <option value="procesando">Procesando</option>
          <option value="completado">Completados</option>
          <option value="error">Con error</option>
        </select>
        <input id="f-texto" type="search" placeholder="Buscar por título o transcripción…">
        <span id="clips-total" class="muted"></span>
      </div>
      <div id="clips-lista" class="grid"></div>
    </section>

    <section class="vista" data-vista="lotes" hidden>
      <div id="lotes-lista" class="lista"></div>
    </section>

    <section class="vista" data-vista="incidencias" hidden>
      <div id="inc-lista" class="lista"></div>
    </section>

    <section class="vista" data-vista="marketing" hidden>
      <div id="m-kpis" class="kpis"></div>
      <h2>Producción de los últimos 7 días</h2>
      <div id="m-actividad" class="chart"></div>
      <div class="dos">
        <div>
          <h2>Palabras clave dominantes</h2>
          <div id="m-claves" class="lista"></div>
        </div>
        <div>
          <h2>Rendimiento por lote</h2>
          <div id="m-lotes" class="lista"></div>
        </div>
      </div>
      <h2>Alcance y publicación</h2>
      <div id="m-publicacion" class="kpis"></div>
      <p id="m-nota" class="muted nota"></p>
    </section>
  </main>

  <dialog id="dlg-llave">
    <form method="dialog" id="form-llave">
      <h3>Llave maestra</h3>
      <p class="muted" id="llave-msg">Introduce la llave para acceder a la API.</p>
      <input id="input-llave" type="password" autocomplete="current-password" placeholder="MASTER_KEY">
      <div class="dlg-actions">
        <button class="btn ghost" type="button" id="llave-cancelar">Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/panel.js"></script>
<script src="/js/motor-nav.js" defer></script>
</body>
</html>
